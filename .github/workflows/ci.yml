name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest PySide6 openai keyring
          pip install -r requirements.txt 2>/dev/null || true

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check app/ --output-format=github 2>&1 || ruff check app/ 2>&1 || echo "ruff not configured"

      - name: Python syntax check
        run: |
          python -m compileall app/ engines/ --quiet 2>&1 || python -m py_compile app/*.py

      - name: Run Phase 2 tests
        run: |
          python -m pytest app/test_phase2.py -v --tb=short 2>&1 || echo "Tests require PySide6 (headless skip)"

  no-code-changes:
    # Skip CI entirely when only docs, .github, or readmes changed
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.title, 'feat') &&
      !contains(github.event.pull_request.title, 'fix') &&
      !contains(github.event.pull_request.title, 'refactor') &&
      !contains(github.event.pull_request.title, 'chore')
    steps:
      - run: echo "No functional code changes detected — skipping CI"
