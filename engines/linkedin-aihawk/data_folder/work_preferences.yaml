remote: true
hybrid: true
onsite: true

# PERSONA 1 - Senior Supply Chain Executive
# NO entry / associate / internship. Targeting mid-senior through director.
experience_level:
  internship: false
  entry: false
  associate: false
  mid_senior_level: true
  director: true
  executive: false

# Permanent leadership roles only - contract/temp/volunteer dropped.
job_types:
  full_time: true
  contract: false
  part_time: false
  temporary: false
  internship: false
  other: false
  volunteer: false

date:
  all_time: false
  month: false
  week: true
  24_hours: false

# JOB TITLES, not broad skills. LinkedIn search is title-weighted, so exact titles
# pull far less noise than single words like "planning" or "operations".
positions:
  - Director of Supply Chain
  - Supply Chain Director
  - VP Supply Chain
  - Head of Supply Chain
  - Senior Supply Chain Manager
  - Global Supply Chain Manager
  - Director of Operations
  - Director of Logistics
  - Head of Planning
  - Director of Planning

# TODO(DECISION PENDING): Trevor has not picked a location split yet.
locations:
  - United States

apply_once_at_company: true

distance: 100

company_blacklist:
  - wayfair
  - Crossover
  - Jobot
  - Dice
  - Insight Global
  - TEKsystems
  - Aerotek
  - Randstad
  - Adecco
  - Kforce
  - Motion Recruitment
  - Cynet
  - Artech
  - Collabera

# NOTE: "Associate" is deliberately NOT blacklisted - it would block good "Associate Director" roles.
title_blacklist:
  - Junior
  - Entry Level
  - Intern
  - Coordinator
  - Assistant
  - Apprentice
  - Clerk
  - Technician
  - Driver
  - CDL
  - Software
  - Developer
  - Frontend
  - Full Stack
  - Recruiter
  - Sales Representative
  - Nurse
  - Teacher

location_blacklist:
  - Brazil
